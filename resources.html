<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resource Search | Anchor Point</title><link rel="stylesheet" href="assets/css/styles.css?v=1.7"></head><body data-page="resources">
<div class="app"><aside class="rail"><a class="brand" href="index.html"><span class="logo">AP</span><span><strong>Anchor Point</strong><span>Resource Portal</span></span></a><nav class="nav"><a href="index.html"><i>⌘</i>Command</a><a class="active" href="resources.html"><i>⌕</i>Search</a><a href="guide.html"><i>▣</i>Guide Builder</a></nav><div class="rail-visual"><img src="assets/img/dashboard-browser.png" alt="Anchor Point resource browser concept"></div><div class="rail-meta"><span>Data source</span><b id="railRecordCount">Loading</b><span>Corrected Summary Tab JSON.</span></div></aside>
<main class="main"><section class="topbar"><form class="command" id="searchForm"><span class="icon">⌕</span><input id="q" aria-label="Search resources" placeholder="Search need, organization, phone, location, notes..."><button class="btn primary" type="submit">Search</button></form><div class="top-actions"><button class="btn" id="trayCollapseBtn" type="button">Hide Tray</button><a class="btn" href="guide.html">Guide <span id="topSelectedCount">0</span></a></div></section>
<section class="panel"><div class="filters"><div class="field"><label>Keyword</label><input id="keyword" aria-label="Keyword search" placeholder="housing, shelter, ECTLC, CalFresh..."></div><div class="field"><label>Category</label><select id="category"><option value="">All categories</option></select></div><div class="field"><label>Urgency</label><select id="urgency"><option value="">All urgency levels</option></select></div><div class="field"><label>Population</label><select id="population"><option value="">All populations</option></select></div><div class="field"><label>Location contains</label><input id="location" aria-label="Location contains" placeholder="El Cajon, East County..."></div><button class="btn" id="clearFilters" type="button">Clear</button></div></section>
<section class="workflow-context" id="activeWorkflow"></section>
<section class="toolbar"><div><strong id="resultCount">Loading</strong> <span id="filterSummary"></span></div><div class="toolbar-actions"><label>Sort <select id="sortMode"><option value="urgency">Urgency</option><option value="name">Name</option><option value="category">Category</option><option value="verified">Verified Date</option></select></label><label>View <select id="viewMode"><option value="cards">Cards</option><option value="list">Compact List</option></select></label><button class="mini-btn" id="showSelectedBtn">Show Selected</button><button class="mini-btn danger" id="clearSelectedBtn">Clear Selected</button></div></section><section class="results" id="results"><div class="empty">Loading resources...</div></section></main>
<aside class="tray" id="guideTray"><button class="btn mobile-tray-toggle" id="trayToggle">Selected Guide</button><div class="tray-head"><h2>Guide Tray</h2><button class="mini-btn tray-hide" id="trayHideBtn" type="button">Hide</button></div><div class="tray-sub"><span id="trayCount">0</span> selected resources</div><div class="guide-list" id="selectedList"><div class="empty">No resources selected yet.</div></div><div class="drawer-actions"><a class="btn primary" href="guide.html">Open Guide</a><button class="btn" id="copyGuideBtn">Copy</button><button class="btn" id="printGuideBtn">Print</button><button class="btn danger" id="clearSelectedBtn2">Clear</button></div></aside></div><div id="printArea" class="print-area"></div><script src="assets/js/app.js?v=1.7"></script></body></html>

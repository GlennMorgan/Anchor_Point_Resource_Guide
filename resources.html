<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resource Search | Anchor Point Resource Portal</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-page="resources">
  <div class="app-shell">
    <aside class="side-rail">
      <a class="brand-lockup" href="index.html" aria-label="Anchor Point Home">
        <span class="brand-mark">AP</span>
        <span><strong>Anchor Point</strong><em>Resource Portal</em></span>
      </a>
      <nav class="rail-nav" aria-label="Primary navigation">
        <a href="index.html" data-nav="home"><span>⌘</span>Command</a>
        <a href="resources.html" data-nav="resources"><span>⌕</span>Search</a>
        <a href="guide.html" data-nav="guide"><span>▣</span>Guide</a>
      </nav>
      <div class="rail-meta">
        <div class="meta-label">Data source</div>
        <div id="railRecordCount">Loading...</div>
        <div class="meta-label">Storage</div>
        <div>Browser only</div>
      </div>
    </aside>

    <main class="main-panel">
      <header class="top-bar">
        <div>
          <p class="eyebrow">Call Center Resource System</p>
          <h1>Resource Search</h1>
        </div>
        <div class="top-actions">
          <a class="ghost-btn" href="resources.html">Search</a>
          <a class="solid-btn" href="guide.html">Build Guide <span id="selectedCountBadge" class="count-badge">0</span></a>
        </div>
      </header>
      
<section class="search-console glass-card compact-panel">
  <div class="search-row">
    <label class="search-box"><span>⌕</span><input id="searchInput" type="search" placeholder="Search by need, organization, phone, city, notes..." /></label>
    <button id="clearFiltersBtn" class="ghost-btn small">Clear</button>
  </div>
  <div class="filter-grid">
    <label>Category<select id="categoryFilter"><option value="">All categories</option></select></label>
    <label>Urgency<select id="urgencyFilter"><option value="">All urgency levels</option></select></label>
    <label>Population<select id="populationFilter"><option value="">All populations</option></select></label>
    <label>Location<input id="locationFilter" type="search" placeholder="City, county, region" /></label>
  </div>
</section>

<section class="results-toolbar">
  <div><strong id="resultCount">Loading resources...</strong><span id="filterSummary"></span></div>
  <div class="toolbar-actions"><a class="ghost-btn small" href="guide.html">View Guide <span id="toolbarSelectedCount">0</span></a></div>
</section>

<section id="resourcesList" class="resource-list compact-list" aria-live="polite"></section>

    </main>
  </div>
  <script src="assets/js/app.js"></script>
  
</body>
</html>
